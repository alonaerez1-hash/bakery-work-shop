name: Deploy Bakery OS marketing site

on:
  push:
    branches: ["main"]
    paths:
      - "landing/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "sw.js"
      - "pako_inflate.min.js"
      - ".github/workflows/deploy-landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare isolated Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app

          # Marketing website becomes the Pages root.
          cp -R landing/. _site/

          # The app source stays untouched in the repository. Deployment only copies
          # the existing files into /app/ so marketing CTAs have a working destination.
          cp index.html _site/app/index.html
          cp styles.css _site/app/styles.css
          cp app.js _site/app/app.js
          cp manifest.json _site/app/manifest.json
          cp sw.js _site/app/sw.js
          cp pako_inflate.min.js _site/app/pako_inflate.min.js

          test -f _site/index.html
          test -f _site/features.html
          test -f _site/how-it-works.html
          test -f _site/for-bakers.html
          test -f _site/calculator.html
          test -f _site/pricing.html
          test -f _site/app/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public marketing site
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          echo "Verifying $SITE_URL"

          success=0
          for attempt in $(seq 1 18); do
            body="$(curl -fsSL --max-time 20 "$SITE_URL" || true)"
            if printf '%s' "$body" | grep -q 'Run a bakery that' && printf '%s' "$body" | grep -q 'Bakery OS'; then
              success=1
              break
            fi
            echo "Marketing site not ready yet (attempt $attempt/18)."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Public marketing site failed smoke test: $SITE_URL" >&2
            curl -I --max-time 20 "$SITE_URL" || true
            exit 1
          fi

      - name: Verify public app route
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          APP_URL="${SITE_URL%/}/app/"
          echo "Verifying $APP_URL"

          success=0
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL --max-time 20 "$APP_URL" || true)"
            if printf '%s' "$body" | grep -q 'Bakery Workspace'; then
              success=1
              break
            fi
            echo "App route not ready yet (attempt $attempt/12)."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Public app route failed smoke test: $APP_URL" >&2
            curl -I --max-time 20 "$APP_URL" || true
            exit 1
          fi
