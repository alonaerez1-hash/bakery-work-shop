name: Restore app and apply safe save fix

on:
  push:
    paths:
      - '.github/workflows/apply-save-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete app from 12.4
        run: git show 21106b2adec1daeabb1d8982253a5da76171fc94:app.js > app.js
      - name: Apply safe recipe save patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify app syntax
        run: node --check app.js
      - name: Commit restored app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          git commit -m '12.6 restore app and fix recipe save'
          git push origin HEAD:main
