<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a160d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bakery OS — ניהול עסק אפייה</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<header class="topbar">
<div><h1 id="brandTitle">Bakery OS</h1><p>מתכונים · הזמנות · ייצור · קניות · מלאי · רווחיות</p></div>
<div class="top-actions"><span id="saveStatus" class="status"></span><button class="btn ghost" id="backupBtn">גיבוי</button><button class="btn ghost" id="cloudBtn">ענן</button></div>
</header>
<nav class="tabs" id="tabs">
<button data-view="dashboard" class="active">לוח ראשי</button><button data-view="orders">הזמנות</button><button data-view="recipes">מתכונים</button><button data-view="recipebook">ספר מתכונים</button><button data-view="production">ייצור</button><button data-view="shopping">קניות</button><button data-view="inventory">מלאי</button><button data-view="suppliers">ספקים ומחירים</button><button data-view="reports">דוחות</button><button data-view="settings">הגדרות</button>
</nav>
<main>
<section class="view active" id="view-dashboard"></section><section class="view" id="view-orders"></section><section class="view" id="view-recipes"></section><section class="view" id="view-recipebook"></section><section class="view" id="view-production"></section><section class="view" id="view-shopping"></section><section class="view" id="view-inventory"></section><section class="view" id="view-suppliers"></section><section class="view" id="view-reports"></section><section class="view" id="view-settings"></section>
</main>
</div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
