<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a160d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bakery OS — ניהול עסק אפייה</title>

<style>
:root{--bg:#f7f0e6;--paper:#fffdf9;--ink:#2a160d;--muted:#806b5a;--line:#ddcdb8;--accent:#e8bd4f;--accent-soft:#f8e4a5;--brown:#2a160d;--green:#6d8b61;--red:#b85e4b;--shadow:0 10px 30px rgba(42,22,13,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#fbf6ee,var(--bg));color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{max-width:1200px;margin:auto;padding:20px 18px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}.topbar h1{margin:0;font-size:1.55rem}.topbar p{margin:3px 0 0;color:var(--muted);font-size:.86rem}.top-actions{display:flex;align-items:center;gap:8px}.status{font-size:.8rem;color:var(--muted);min-width:70px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:2px;border-bottom:2px solid var(--brown);margin-bottom:18px}.tabs button{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);font-weight:700;border-radius:8px 8px 0 0}.tabs button.active{background:var(--brown);color:var(--accent-soft)}
.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:1.12rem}.card h3{font-size:1rem}.metric{padding:16px;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}.metric .label{font-size:.78rem;color:var(--muted)}.metric .value{font-size:1.55rem;font-weight:800;margin-top:4px}.metric .sub{font-size:.76rem;color:var(--muted);margin-top:3px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--brown);color:var(--accent-soft)}.btn.secondary{background:var(--accent);color:var(--brown)}.btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--brown)}.btn.danger{background:transparent;color:var(--red);border:1px solid #dca99f}.btn.small{padding:6px 10px;font-size:.8rem}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:.79rem;font-weight:700}input,select,textarea{width:100%;padding:10px 11px;border:1.4px solid var(--line);border-radius:8px;background:#fffaf2;color:var(--ink);text-align:right}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--brown)}textarea{min-height:84px;resize:vertical}.hint{font-size:.76rem;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:680px;background:var(--paper)}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:.84rem;vertical-align:top}th{background:#f4eadc;font-size:.77rem;position:sticky;top:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:#eee2d4}.badge.green{background:#dce9d8;color:#45613e}.badge.red{background:#f4dcd7;color:#8b3a2a}.badge.blue{background:#dce9ee;color:#315d6f}.badge.gold{background:#f6e7b8;color:#705409}
.list{display:flex;flex-direction:column;gap:9px}.list-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdf9}.list-item .title{font-weight:800}.meta{font-size:.78rem;color:var(--muted);margin-top:3px}.item-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.empty{text-align:center;padding:34px;color:var(--muted)}.notice{padding:11px 12px;border-radius:9px;background:#fff3cc;border:1px solid #e9cf76;font-size:.82rem}.notice.error{background:#f9e0db;border-color:#dca89c;color:#7d3022}
.kpi-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:8px 0}.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.task input{width:auto;margin-top:4px}.task.done .task-text{text-decoration:line-through;color:#9b8b80}.day-title{display:inline-block;background:var(--accent);padding:7px 12px;border-radius:8px;font-weight:800;margin:6px 0 10px}
.modal{display:none;position:fixed;inset:0;background:rgba(24,10,5,.5);z-index:50;padding:18px;overflow:auto}.modal.open{display:block}.modal-card{background:var(--paper);max-width:850px;margin:3vh auto;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0}.icon-btn{border:0;background:transparent;font-size:1.3rem}
.repeat-row{display:grid;grid-template-columns:2fr .8fr .8fr .8fr auto;gap:8px;align-items:end;margin-bottom:8px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.money{font-variant-numeric:tabular-nums;font-weight:800}.muted{color:var(--muted)}
@media(max-width:850px){.grid.four,.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.two,.form-grid,.form-grid.three{grid-template-columns:1fr}.repeat-row{grid-template-columns:1fr 1fr}.repeat-row>*:first-child{grid-column:1/-1}.field.full{grid-column:auto}}
@media(max-width:560px){#app{padding:14px 10px 70px}.grid.four,.grid.three{grid-template-columns:1fr}.top-actions{width:100%;justify-content:space-between}.card{padding:14px}.tabs button{padding:9px 11px}.repeat-row{grid-template-columns:1fr}.repeat-row>*:first-child{grid-column:auto}.modal{padding:8px}.modal-card{margin:1vh auto}}
@media print{.tabs,.top-actions,.btn,.modal{display:none!important}.view{display:block!important}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
<div><h1 id="brandTitle">Bakery OS</h1><p>מתכונים · הזמנות · ייצור · קניות · מלאי · רווחיות</p></div>
<div class="top-actions"><span id="saveStatus" class="status"></span><button class="btn ghost" id="backupBtn">גיבוי</button><button class="btn ghost" id="cloudBtn">ענן</button></div>
</header>
<nav class="tabs" id="tabs">
<button data-view="dashboard" class="active">לוח ראשי</button><button data-view="orders">הזמנות</button><button data-view="recipes">מתכונים</button><button data-view="production">ייצור</button><button data-view="shopping">קניות</button><button data-view="inventory">מלאי</button><button data-view="suppliers">ספקים ומחירים</button><button data-view="reports">דוחות</button><button data-view="settings">הגדרות</button>
</nav>
<main>
<section class="view active" id="view-dashboard"></section><section class="view" id="view-orders"></section><section class="view" id="view-recipes"></section><section class="view" id="view-production"></section><section class="view" id="view-shopping"></section><section class="view" id="view-inventory"></section><section class="view" id="view-suppliers"></section><section class="view" id="view-reports"></section><section class="view" id="view-settings"></section>
</main>
</div>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>(() => {
'use strict';
const LS_KEY='bakery_os_state_v1', CLOUD_KEY='bakery_os_cloud_v1';
const UNITS=['גרם','ק"ג','מ"ל','ליטר','יחידה','חבילה','כפית','כף','כוס'];
const WEIGHT={'גרם':1,'ק"ג':1000}, VOLUME={'מ"ל':1,'ליטר':1000};
const STATUSES=['חדשה','מאושרת','בייצור','מוכנה','נמסרה','בוטלה'];
const CATS=['יבשים','מקרר','קפואים','תוספות','אריזות','אחר'];
let currentView='dashboard', cloud={client:null,user:null};
const empty=()=>({settings:{businessName:'Bakery OS',currency:'₪',laborRate:45,distanceCostPerKm:1.5,ovens:1,ovenTrays:2,workStart:'08:00',workEnd:'18:00'},recipes:[],orders:[],inventory:[],suppliers:[],checkedTasks:{},checkedShopping:{},updatedAt:null});
let state=load();
function load(){try{return {...empty(),...JSON.parse(localStorage.getItem(LS_KEY)||'null')}}catch(e){return empty()}}
function id(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n,d=2){return Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:d})}
function money(n){return `${fmt(n)} ${state.settings.currency||'₪'}`}
function dateText(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('he-IL',{dateStyle:'short',timeStyle:v.includes('T')?'short':undefined})}
function dayKey(v){const d=new Date(v);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}
function addDays(v,n){const d=new Date(v);d.setDate(d.getDate()+n);return d}
function norm(q,u){if(WEIGHT[u])return{qty:Number(q||0)*WEIGHT[u],unit:'גרם'};if(VOLUME[u])return{qty:Number(q||0)*VOLUME[u],unit:'מ"ל'};return{qty:Number(q||0),unit:u}}
function showQty(q,u){if(u==='גרם'&&q>=1000)return`${fmt(q/1000)} ק"ג`;if(u==='מ"ל'&&q>=1000)return`${fmt(q/1000)} ליטר`;return`${fmt(q)} ${u}`}
function setStatus(t){const e=document.getElementById('saveStatus');if(e)e.textContent=t||''}
async function persist(sync=true){state.updatedAt=new Date().toISOString();localStorage.setItem(LS_KEY,JSON.stringify(state));setStatus('✓ נשמר');setTimeout(()=>setStatus(''),1200);if(sync&&cloud.user)await pushCloud()}
function recipe(x){return state.recipes.find(r=>r.id===x)}
function activeOrders(){return state.orders.filter(o=>!['נמסרה','בוטלה'].includes(o.status))}
function revenue(o){return(o.items||[]).reduce((s,i)=>s+(recipe(i.recipeId)?.salePrice||0)*Number(i.qty||0),0)}
function invAmount(name,unit){const t=norm(1,unit);let total=0;state.inventory.forEach(i=>{if(i.name.trim().toLowerCase()!==name.trim().toLowerCase())return;const x=norm(i.qty,i.unit);if(x.unit===t.unit)total+=x.qty});return total}
function unitCost(name,unit){const t=norm(1,unit),a=[];state.inventory.forEach(i=>{if(i.name.trim().toLowerCase()===name.trim().toLowerCase()&&Number(i.unitCost)>0){const x=norm(1,i.unit);if(x.unit===t.unit)a.push(Number(i.unitCost)/x.qty)}});state.suppliers.forEach(s=>(s.prices||[]).forEach(p=>{if(p.ingredient.trim().toLowerCase()===name.trim().toLowerCase()){const x=norm(p.packQty,p.unit);if(x.unit===t.unit&&x.qty)a.push(Number(p.packPrice)/x.qty)}}));return a.length?Math.min(...a):0}
function recipeCost(r){let ingredients=0;(r.ingredients||[]).forEach(i=>{const x=norm(i.qty,i.unit);ingredients+=x.qty*unitCost(i.name,i.unit)});const labor=(Number(r.prepMin||0)+Number(r.bakeMin||0))/60*Number(state.settings.laborRate||0);const packaging=Number(r.packagingCost||0)*(Number(r.yieldUnits)||1);const total=(ingredients+labor+packaging)*(1+Number(r.wastePct||0)/100);return{ingredients,labor,packaging,total,perUnit:total/(Number(r.yieldUnits)||1)}}
function demand(){const byRecipe={},ingredients={};activeOrders().forEach(o=>(o.items||[]).forEach(i=>byRecipe[i.recipeId]=(byRecipe[i.recipeId]||0)+Number(i.qty||0)));Object.entries(byRecipe).forEach(([rid,q])=>{const r=recipe(rid);if(!r)return;const batches=Math.ceil(q/(Number(r.yieldUnits)||1));(r.ingredients||[]).forEach(i=>{const x=norm(Number(i.qty||0)*batches,i.unit),k=i.name.trim().toLowerCase()+'|'+x.unit;if(!ingredients[k])ingredients[k]={name:i.name,unit:x.unit,required:0,category:i.category||'אחר'};ingredients[k].required+=x.qty})});return{byRecipe,ingredients}}
function tasks(){const out=[];activeOrders().forEach(o=>(o.items||[]).forEach(it=>{const r=recipe(it.recipeId);if(!r)return;const batches=Math.ceil(Number(it.qty||0)/(Number(r.yieldUnits)||1)),steps=r.steps?.length?r.steps:[{text:'הכנת חומרי גלם ושקילות',daysBefore:1},{text:'הכנה ואפייה',daysBefore:0},{text:'קירור, אריזה ותיוג',daysBefore:0}];steps.forEach((s,n)=>{const d=addDays(o.dueAt,-Number(s.daysBefore||0)),key=`${o.id}|${r.id}|${n}|${dayKey(d)}`;out.push({key,date:dayKey(d),time:s.time||'',text:s.text,recipe:r.name,customer:o.customer,batches,qty:Number(it.qty||0),done:!!state.checkedTasks[key]})})}));return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function shopping(){return Object.entries(demand().ingredients).map(([key,x])=>{const available=invAmount(x.name,x.unit);return{...x,key,available,need:Math.max(0,x.required-available),checked:!!state.checkedShopping[key]}}).filter(x=>x.need>0).sort((a,b)=>a.category.localeCompare(b.category,'he')||a.name.localeCompare(b.name,'he'))}
function supplierOptions(){const items=shopping();return state.suppliers.map(s=>{let itemsCost=0,covered=0;(items||[]).forEach(it=>{let best=null;(s.prices||[]).filter(p=>p.ingredient.trim().toLowerCase()===it.name.trim().toLowerCase()).forEach(p=>{const x=norm(p.packQty,p.unit);if(x.unit!==it.unit||!x.qty)return;const packs=Math.ceil(it.need/x.qty),cost=packs*Number(p.packPrice||0);if(!best||cost<best)best=cost});if(best!==null){itemsCost+=best;covered++}});const delivery=Number(s.deliveryCost||0),distanceCost=Number(s.distanceKm||0)*2*Number(state.settings.distanceCostPerKm||0);return{supplier:s,itemsCost,covered,delivery,distanceCost,total:itemsCost+delivery+distanceCost}}).sort((a,b)=>a.total-b.total)}
function go(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
function modal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}
function close(){document.getElementById('modal').classList.remove('open')}
function render(){document.getElementById('brandTitle').textContent=state.settings.businessName||'Bakery OS';({dashboard:renderDashboard,orders:renderOrders,recipes:renderRecipes,production:renderProduction,shopping:renderShopping,inventory:renderInventory,suppliers:renderSuppliers,reports:renderReports,settings:renderSettings}[currentView]||renderDashboard)()}
function taskHtml(t){return`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="App.toggleTask('${t.key}')"><div class="task-text"><strong>${esc(t.text)}</strong><div class="meta">${esc(t.recipe)} · ${t.batches} כפולות · ${fmt(t.qty,0)} יחידות · ${esc(t.customer)} ${t.time?'· '+t.time:''}</div></div></div>`}
function renderDashboard(){const os=activeOrders(),ts=tasks(),today=dayKey(new Date()),low=state.inventory.filter(i=>Number(i.qty)<=Number(i.minQty)).length,up=os.slice().sort((a,b)=>a.dueAt.localeCompare(b.dueAt)).slice(0,5);document.getElementById('view-dashboard').innerHTML=`<div class="grid four"><div class="metric"><div class="label">הזמנות פעילות</div><div class="value">${os.length}</div></div><div class="metric"><div class="label">הכנסה צפויה</div><div class="value">${money(os.reduce((s,o)=>s+revenue(o),0))}</div></div><div class="metric"><div class="label">משימות להיום</div><div class="value">${ts.filter(t=>t.date===today&&!t.done).length}</div></div><div class="metric"><div class="label">מלאי נמוך</div><div class="value">${low}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head"><h2>הזמנות קרובות</h2><button class="btn small secondary" onclick="App.newOrder()">+ הזמנה</button></div>${up.length?`<div class="list">${up.map(o=>`<div class="list-item"><div class="item-row"><div><div class="title">${esc(o.customer)}</div><div class="meta">${dateText(o.dueAt)} · ${esc(o.status)} · ${money(revenue(o))}</div></div><span class="badge blue">${esc(o.delivery)}</span></div></div>`).join('')}</div>`:'<div class="empty">אין הזמנות פעילות</div>'}</div><div class="card"><h2>היום בייצור</h2>${ts.filter(t=>t.date===today).map(taskHtml).join('')||'<div class="empty">אין משימות להיום</div>'}</div></div><div class="grid two" style="margin-top:14px"><div class="card"><h2>קניות נדרשות</h2>${shopping().slice(0,6).map(i=>`<div class="kpi-line"><span>${esc(i.name)}</span><strong>${showQty(i.need,i.unit)}</strong></div>`).join('')||'<div class="empty">אין חוסרים</div>'}</div><div class="card"><h2>פעולות מהירות</h2><div class="actions"><button class="btn" onclick="App.newRecipe()">מתכון חדש</button><button class="btn secondary" onclick="App.newOrder()">הזמנה חדשה</button><button class="btn ghost" onclick="App.newInventory()">עדכון מלאי</button></div></div></div>`}
function renderOrders(){const rows=state.orders.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));document.getElementById('view-orders').innerHTML=`<div class="card"><div class="section-head"><div><h2>הזמנות</h2><div class="hint">כל הזמנה מזינה את תוכנית הייצור והקניות.</div></div><button class="btn secondary" onclick="App.newOrder()">+ הזמנה חדשה</button></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>לקוחה</th><th>מועד</th><th>פריטים</th><th>סטטוס</th><th>תשלום</th><th>סכום</th><th></th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${esc(o.customer)}</strong><div class="muted">${esc(o.phone||'')}</div></td><td>${dateText(o.dueAt)}<div class="muted">${esc(o.delivery)}</div></td><td>${(o.items||[]).map(i=>`${esc(recipe(i.recipeId)?.name||'מתכון נמחק')} × ${fmt(i.qty,0)}`).join('<br>')}</td><td><span class="badge">${esc(o.status)}</span></td><td>${o.paid?'<span class="badge green">שולם</span>':'<span class="badge red">לא שולם</span>'}</td><td class="money">${money(revenue(o))}</td><td><div class="actions"><button class="btn small ghost" onclick="App.editOrder('${o.id}')">עריכה</button><button class="btn small danger" onclick="App.deleteOrder('${o.id}')">מחיקה</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">עדיין אין הזמנות</div>'}</div>`}
function orderRow(i){return`<div class="repeat-row order-item-row"><div class="field"><label>מתכון</label><select class="oi-r" required><option value="">בחירה</option>${state.recipes.map(r=>`<option value="${r.id}" ${i.recipeId===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>כמות</label><input class="oi-q" type="number" min="1" value="${i.qty||1}"></div><div></div><div></div><button type="button" class="btn small danger" onclick="this.closest('.order-item-row').remove()">הסר</button></div>`}

t name="salePrice" type="number" step=".01" min="0" value="${r.salePrice}"></div><div class="field"><label>אלרגנים</label><input name="allergens" value="${esc(r.allergens)}"></div><div class="field full"><label>רכיבים</label><div id="recipeIngredients">${(r.ingredients.length?r.ingredients:[{name:'',qty:'',unit:'גרם',category:'יבשים'}]).map(ingredientRow).join('')}</div><button type="button" class="btn small secondary" onclick="App.addIngredient()">+ רכיב</button></div><div class="field full"><label>שלבי עבודה</label><div id="recipeSteps">${(r.steps.length?r.steps:[{text:'',daysBefore:0,time:''}]).map(stepRow).join('')}</div><button type="button" class="btn small secondary" onclick="App.addStep()">+ שלב</button></div><div class="field full"><label>הערות ואחסון</label><textarea name="notes">${esc(r.notes)}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn">שמירה</button><button type="button" class="btn ghost" onclick="App.close()">ביטול</button></div></form>`);document.getElementById('recipeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),ex=state.recipes.find(x=>x.id===f.get('id')),ingredients=[...document.querySelectorAll('.ingredient-row')].map(x=>({name:x.querySelector('.ri-n').value.trim(),qty:Number(x.querySelector('.ri-q').value||0),unit:x.querySelector('.ri-u').value,category:x.querySelector('.ri-c').value})).filter(x=>x.name&&x.qty),steps=[...document.querySelectorAll('.step-row')].map(x=>({text:x.querySelector('.rs-t').value.trim(),daysBefore:Number(x.querySelector('.rs-d').value||0),time:x.querySelector('.rs-h').value})).filter(x=>x.text),obj={id:f.get('id')||id('rec'),name:f.get('name'),category:f.get('category'),yieldUnits:Number(f.get('yieldUnits')||1),unitWeight:Number(f.get('unitWeight')||0),prepMin:Number(f.get('prepMin')||0),restMin:Number(f.get('restMin')||0),bakeMin:Number(f.get('bakeMin')||0),ovenTemp:Number(f.get('ovenTemp')||0),traysPerBatch:Number(f.get('traysPerBatch')||1),unitsPerTray:Number(f.get('unitsPerTray')||1),shelfLifeDays:Number(f.get('shelfLifeDays')||0),packagingCost:Number(f.get('packagingCost')||0),wastePct:Number(f.get('wastePct')||0),salePrice:Number(f.get('salePrice')||0),allergens:f.get('allergens'),notes:f.get('notes'),ingredients,steps};if(ex)Object.assign(ex,obj);else state.recipes.push(obj);await persist();close();render()}}

function renderInventory(){const soon=addDays(new Date(),7);document.getElementById('view-inventory').innerHTML=`<div class="card"><div class="section-head"><div><h2>מלאי</h2><div class="hint">המלאי מופחת אוטומטית מרשימת הקניות.</div></div><button class="btn secondary" onclick="App.newInventory()">+ פריט מלאי</button></div>${state.inventory.length?`<div class="table-wrap"><table><thead><tr><th>רכיב</th><th>כמות</th><th>מינימום</th><th>תפוגה</th><th>מיקום</th><th>עלות</th><th></th></tr></thead><tbody>${state.inventory.map(i=>{const low=Number(i.qty)<=Number(i.minQty),exp=i.expiry&&new Date(i.expiry)<=soon;return`<tr><td><strong>${esc(i.name)}</strong>${low?'<div><span class="badge red">מלאי נמוך</span></div>':''}</td><td>${showQty(i.qty,i.unit)}</td><td>${showQty(i.minQty,i.unit)}</td><td>${i.expiry?dateText(i.expiry):'—'} ${exp?'<span class="badge gold">קרוב</span>':''}</td><td>${esc(i.location||'')}</td><td>${money(i.unitCost||0)} / ${esc(i.unit)}</td><td><div class="actions"><button class="btn small ghost" onclick="App.editInventory('${i.id}')">עריכה</button><button class="btn small danger" onclick="App.deleteInventory('${i.id}')">מחיקה</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">אין פריטי מלאי</div>'}</div>`}

function renderSuppliers(){const opts=supplierOptions();document.getElementById('view-suppliers').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><div><h2>ספקים וחנויות</h2><div class="hint">מחיר, מרחק ומשלוח לחישוב עלות אמיתית.</div></div><button class="btn secondary" onclick="App.newSupplier()">+ ספק</button></div>${state.suppliers.length?`<div class="list">${state.suppliers.map(s=>`<div class="list-item"><div class="item-row"><div><div class="title">${esc(s.name)}</div><div class="meta">${fmt(s.distanceKm)} ק"מ · משלוח ${money(s.deliveryCost)} · ${(s.prices||[]).length} מחירים</div></div><div class="actions"><button class="btn small ghost" onclick="App.editSupplier('${s.id}')">עריכה</button><button class="btn small danger" onclick="App.deleteSupplier('${s.id}')">מחיקה</button></div></div>${s.address?`<div style="margin-top:8px"><a class="btn small ghost" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}">ניווט</a></div>`:''}</div>`).join('')}</div>`:'<div class="empty">אין ספקים</div>'}</div><div class="card"><h2>השוואת סל נוכחי</h2>${opts.length?`<div class="table-wrap"><table><thead><tr><th>ספק</th><th>כיסוי</th><th>פריטים</th><th>משלוח</th><th>נסיעה</th><th>סה"כ</th></tr></thead><tbody>${opts.map(o=>`<tr><td>${esc(o.supplier.name)}</td><td>${o.covered}</td><td>${money(o.itemsCost)}</td><td>${money(o.delivery)}</td><td>${money(o.distanceCost)}</td><td class="money">${money(o.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין מספיק נתונים</div>'}<div class="notice" style="margin-top:12px">סריקת מחירים אוטומטית דורשת API או מקור נתונים מאושר לכל רשת. כאן המחירים מוזנים ידנית.</div></div></div>`}
function priceRow(p){return`<div class="repeat-row price-row"><div class="field"><label>רכיב</label><input class="sp-i" value="${esc(p.ingredient||'')}"></div><div class="field"><label>כמות בחבילה</label><input class="sp-q" type="number" min="0" step=".01" value="${p.packQty||0}"></div><div class="field"><label>יחידה</label><select class="sp-u">${UNITS.map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>מחיר חבילה</label><input class="sp-p" type="number" min="0" step=".01" value="${p.packPrice||0}"></div><button type="button" class="btn small danger" onclick="this.closest('.price-row').remove()">הסר</button></div>`}
function supplierForm(s={id:'',name:'',address:'',distanceKm:0,deliveryCost:0,notes:'',prices:[]}){modal(s.id?'עריכת ספק':'ספק חדש',`<form id="supForm"><input type="hidden" name="id" value="${esc(s.id)}"><div class="form-grid"><div class="field"><label>שם ספק/חנות</label><input name="name" required value="${esc(s.name)}"></div><div class="field"><label>כתובת</label><input name="address" value="${esc(s.address)}"></div><div class="field"><label>מרחק בק"מ</label><input name="distanceKm" type="number" step=".1" min="0" value="${s.distanceKm}"></div><div class="field"><label>עלות משלוח</label><input name="deliveryCost" type="number" step=".01" min="0" value="${s.deliveryCost}"></div><div class="field full"><label>מחירי אריזות</label><div id="supplierPrices">${(s.prices.length?s.prices:[{ingredient:'',packQty:1,unit:'ק"ג',packPrice:0}]).map(priceRow).join('')}</div><button type="button" class="btn small secondary" onclick="App.addPrice()">+ מחיר</button></div><div class="field full"><label>הערות</label><textarea name="notes">${esc(s.notes)}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn">שמירה</button><button type="button" class="btn ghost" onclick="App.close()">ביטול</button></div></form>`);document.getElementById('supForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),ex=state.suppliers.find(x=>x.id===f.get('id')),prices=[...document.querySelectorAll('.price-row')].map(r=>({ingredient:r.querySelector('.sp-i').value.trim(),packQty:Number(r.querySelector('.sp-q').value||0),unit:r.querySelector('.sp-u').value,packPrice:Number(r.querySelector('.sp-p').value||0),updatedAt:new Date().toISOString()})).filter(x=>x.ingredient&&x.packQty),obj={id:f.get('id')||id('sup'),name:f.get('name'),address:f.get('address'),distanceKm:Number(f.get('distanceKm')||0),deliveryCost:Number(f.get('deliveryCost')||0),notes:f.get('notes'),prices};if(ex)Object.assign(ex,obj);else state.suppliers.push(obj);await persist();close();render()}}
function renderReports(){const os=state.orders.filter(o=>o.status!=='בוטלה'),rev=os.reduce((s,o)=>s+revenue(o),0);let cost=0,by={};os.forEach(o=>(o.items||[]).forEach(i=>{const r=recipe(i.recipeId);if(r)cost+=recipeCost(r).perUnit*Number(i.qty);by[i.recipeId]=(by[i.recipeId]||0)+Number(i.qty)}));const profit=rev-cost;document.getElementById('view-reports').innerHTML=`<div class="grid four"><div class="metric"><div class="label">הכנסות</div><div class="value">${money(rev)}</div></div><div class="metric"><div class="label">עלות משוערת</div><div class="value">${money(cost)}</div></div><div class="metric"><div class="label">רווח גולמי</div><div class="value">${money(profit)}</div></div><div class="metric"><div class="label">שיעור רווח</div><div class="value">${rev?fmt(profit/rev*100,1):0}%</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h2>מוצרים נמכרים</h2>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([rid,q])=>`<div class="kpi-line"><span>${esc(recipe(rid)?.name||'מתכון')}</span><strong>${fmt(q,0)} יחידות</strong></div>`).join('')||'<div class="empty">אין נתונים</div>'}</div><div class="card"><h2>רווחיות מתכונים</h2>${state.recipes.map(r=>{const c=recipeCost(r);return`<div class="kpi-line"><span>${esc(r.name)}</span><strong>${money(Number(r.salePrice)-c.perUnit)} ליחידה</strong></div>`}).join('')||'<div class="empty">אין מתכונים</div>'}</div></div><div class="card" style="margin-top:14px"><div class="notice">זהו אומדן ניהולי. שכירות, מסים, עמלות, פחת והוצאות קבועות אינן נכללות אלא אם הזנת אותן במחירים ובשכר העבודה.</div></div>`}
function getCloud(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null')}catch(e){return null}}
function renderSettings(){const c=getCloud();document.getElementById('view-settings').innerHTML=`<div class="grid two"><div class="card"><h2>הגדרות העסק</h2><form id="setForm"><div class="form-grid"><div class="field"><label>שם העסק</label><input name="businessName" value="${esc(state.settings.businessName)}"></div><div class="field"><label>מטבע</label><input name="currency" value="${esc(state.settings.currency)}"></div><div class="field"><label>שכר עבודה לשעה</label><input name="laborRate" type="number" min="0" value="${state.settings.laborRate}"></div><div class="field"><label>עלות נסיעה לק"מ</label><input name="distanceCostPerKm" type="number" step=".1" min="0" value="${state.settings.distanceCostPerKm}"></div><div class="field"><label>מספר תנורים</label><input name="ovens" type="number" min="1" value="${state.settings.ovens}"></div><div class="field"><label>מגשים במקביל</label><input name="ovenTrays" type="number" min="1" value="${state.settings.ovenTrays}"></div><div class="field"><label>תחילת יום</label><input name="workStart" type="time" value="${state.settings.workStart}"></div><div class="field"><label>סיום יום</label><input name="workEnd" type="time" value="${state.settings.workEnd}"></div></div><button class="btn" style="margin-top:12px">שמירה</button></form></div><div class="card"><h2>שמירה בענן</h2>${cloud.user?`<div class="notice"><strong>מחוברת:</strong> ${esc(cloud.user.email||'')}</div><div class="actions" style="margin-top:10px"><button class="btn ghost" onclick="App.pullCloud()">טעינה מהענן</button><button class="btn danger" onclick="App.logout()">יציאה</button></div>`:`<div class="hint">לסנכרון בין מחשב לאייפון הגדירי Supabase והתחברי עם אותו חשבון.</div><div class="form-grid" style="margin-top:10px"><div class="field full"><label>Project URL</label><input id="cloudUrl" value="${esc(c?.url||'')}"></div><div class="field full"><label>Publishable/Anon Key</label><input id="cloudKey" value="${esc(c?.key||'')}"></div><div class="field"><label>אימייל</label><input id="cloudEmail" type="email"></div><div class="field"><label>סיסמה</label><input id="cloudPassword" type="password"></div></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="App.cloudLogin()">כניסה</button><button class="btn secondary" onclick="App.cloudSignup()">יצירת חשבון</button></div>`}</div><div class="card"><h2>גיבוי</h2><div class="actions"><button class="btn ghost" onclick="App.exportData()">ייצוא JSON</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">ייבוא JSON</button><button class="btn danger" onclick="App.resetAll()">איפוס</button></div></div><div class="card"><h2>התקנה באייפון</h2><div class="hint">לאחר פרסום האתר ב-HTTPS: פתחי ב-Safari, לחצי שיתוף ואז „הוספה למסך הבית”.</div></div></div>`;document.getElementById('setForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(state.settings,{businessName:f.get('businessName'),currency:f.get('currency'),laborRate:Number(f.get('laborRate')),distanceCostPerKm:Number(f.get('distanceCostPerKm')),ovens:Number(f.get('ovens')),ovenTrays:Number(f.get('ovenTrays')),workStart:f.get('workStart'),workEnd:f.get('workEnd')});await persist();render()}}
function initCloud(){const c=getCloud();if(!c?.url||!c?.key||!window.supabase)return false;cloud.client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});return true}
async function cloudAuth(mode){const url=document.getElementById('cloudUrl')?.value.trim(),key=document.getElementById('cloudKey')?.value.trim(),email=document.getElementById('cloudEmail')?.value.trim(),password=document.getElementById('cloudPassword')?.value;if(!url||!key||!email||!password)return alert('יש למלא את כל פרטי החיבור');localStorage.setItem(CLOUD_KEY,JSON.stringify({url,key}));initCloud();const res=mode==='signup'?await cloud.client.auth.signUp({email,password}):await cloud.client.auth.signInWithPassword({email,password});if(res.error)return alert(res.error.message);cloud.user=res.data.user;if(cloud.user){await pushCloud();render()}else alert('נשלח אימייל אימות. אשרי אותו ואז התחברי.')}
async function pushCloud(){if(!cloud.user||!cloud.client)return;const {error}=await cloud.client.from('bakery_os_data').upsert({user_id:cloud.user.id,data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)console.error(error)}
async function pullCloud(show=true){if(!cloud.user||!cloud.client)return;if(show)setStatus('טוען מהענן…');const {data,error}=await cloud.client.from('bakery_os_data').select('data').eq('user_id',cloud.user.id).maybeSingle();if(error)return alert(error.message);if(data?.data){state={...empty(),...data.data};localStorage.setItem(LS_KEY,JSON.stringify(state));render()}if(show)setStatus('✓ סונכרן')}
async function initSession(){if(!initCloud())return;const {data}=await cloud.client.auth.getSession();cloud.user=data?.session?.user||null;if(cloud.user)await pullCloud(false)}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bakery-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(f){try{state={...empty(),...JSON.parse(await f.text())};await persist();render();alert('הנתונים יובאו')}catch(e){alert('קובץ לא תקין')}}
window.App={go,close,newOrder:()=>orderForm(),editOrder:x=>orderForm(state.orders.find(o=>o.id===x)),deleteOrder:async x=>{if(confirm('למחוק את ההזמנה?')){state.orders=state.orders.filter(o=>o.id!==x);await persist();render()}},addOrderItem:()=>document.getElementById('orderItems').insertAdjacentHTML('beforeend',orderRow({recipeId:'',qty:1})),newRecipe:()=>recipeForm(),editRecipe:x=>recipeForm(state.recipes.find(r=>r.id===x)),deleteRecipe:async x=>{if(confirm('למחוק את המתכון?')){state.recipes=state.recipes.filter(r=>r.id!==x);await persist();render()}},addIngredient:()=>document.getElementById('recipeIngredients').insertAdjacentHTML('beforeend',ingredientRow({name:'',qty:'',unit:'גרם',category:'אחר'})),addStep:()=>document.getElementById('recipeSteps').insertAdjacentHTML('beforeend',stepRow({text:'',daysBefore:0,time:''})),toggleTask:async k=>{state.checkedTasks[k]=!state.checkedTasks[k];await persist();render()},toggleShopping:async k=>{state.checkedShopping[k]=!state.checkedShopping[k];await persist();render()},newInventory:()=>inventoryForm(),editInventory:x=>inventoryForm(state.inventory.find(i=>i.id===x)),deleteInventory:async x=>{if(confirm('למחוק את הפריט?')){state.inventory=state.inventory.filter(i=>i.id!==x);await persist();render()}},newSupplier:()=>supplierForm(),editSupplier:x=>supplierForm(state.suppliers.find(s=>s.id===x)),deleteSupplier:async x=>{if(confirm('למחוק את הספק?')){state.suppliers=state.suppliers.filter(s=>s.id!==x);await persist();render()}},addPrice:()=>document.getElementById('supplierPrices').insertAdjacentHTML('beforeend',priceRow({ingredient:'',packQty:1,unit:'ק"ג',packPrice:0})),exportData,cloudLogin:()=>cloudAuth('login'),cloudSignup:()=>cloudAuth('signup'),pullCloud,logout:async()=>{if(cloud.client)await cloud.client.auth.signOut();cloud.user=null;render()},resetAll:async()=>{if(confirm('למחוק את כל הנתונים?')){state=empty();await persist(false);render()}}};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('modalClose').onclick=close;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')close()};document.getElementById('backupBtn').onclick=exportData;document.getElementById('cloudBtn').onclick=()=>go('settings');document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));initSession().finally(render);
})();
</script>
</body>
</html>
